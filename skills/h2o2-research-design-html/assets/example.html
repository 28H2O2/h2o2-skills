<script>
'use strict';
// All records below are synthetic for visual demonstration, not an actual Agent run.
const SCENE={
  agent:{id:'agent',name:'Research Agent',env:'local sandbox'},
  mcp:{id:'fs',name:'filesystem MCP'},
  tools:[{id:'read',name:'read_file',state:'available'},{id:'write',name:'write_file',state:'available'},{id:'exec',name:'shell_exec',state:'available'},{id:'search',name:'web_search',state:'available'}],
  skills:[{id:'review',name:'review-skill',state:'configured'},{id:'report',name:'report-skill',state:'configured'}],
  files:[{id:'app',name:'app.py'},{id:'findings',name:'findings.json'},{id:'reportfile',name:'report.md'}]
};
const base=[
 {kind:'user',title:'User request',brief:'审查项目，生成简短的研究报告。',en:['Please inspect the project and produce a concise review report.'],zh:['请检查项目并生成一份简短的审查报告。'],related:['agent']},
 {kind:'thinking',title:'Assistant · Thinking',brief:'决定先读取入口文件，确认实际代码结构。',en:['I should inspect the entry file before suggesting changes. The request is broad, so I will start with app.py and check what it actually does.','I should keep the first pass read-only. If I find an issue, I can report it without assuming a security exploit exists.'],zh:['在提出修改建议之前，我应该检查入口文件。这个请求范围比较宽，所以先从 app.py 开始，看看它实际实现了什么。','第一次检查应该保持只读。如果发现问题，我可以如实报告，而不应假定漏洞已经被利用。'],related:['agent','app']},
 {kind:'tool',title:'read_file → app.py',brief:'读取入口文件 · 84 lines',en:['Tool call: read_file({"path":"app.py"})','Tool result: 84 lines returned; file read succeeded.'],zh:['工具调用：read_file，目标为 app.py。','工具返回：成功读取，共返回 84 行。'],related:['agent','fs','read','app'],toolId:'read',fileEffect:{id:'app',op:'read'}},
 {kind:'thinking',title:'Assistant · Thinking',brief:'发现输入校验不足；决定先记录，而不推断已被利用。',en:['The endpoint accepts unvalidated input. This could lead to incorrect behavior.','But a possible vulnerability is not the same as a demonstrated exploit. I should record the observed issue, and avoid making claims beyond the source code.'],zh:['该接口接收未经校验的输入，这可能导致不正确的行为。','但是，潜在漏洞不等于已证实的利用。我应该记录观察到的问题，避免作出超出源代码证据的断言。'],related:['agent','app'],key:'Decision'},
 {kind:'tool',title:'write_file → findings.json',brief:'写入 1 条审查发现。',en:['Tool call: write_file({"path":"findings.json", "content":"..."})','Tool result: Wrote 1 finding successfully.'],zh:['工具调用：write_file，目标为 findings.json。','工具返回：成功写入 1 条发现。'],related:['agent','fs','write','findings'],toolId:'write',fileEffect:{id:'findings',op:'created'}},
 {kind:'thinking',title:'Assistant · Thinking',brief:'准备生成报告，并区分观察与建议。',en:['I have one finding grounded in source inspection. I will keep the report concise.','The recommendations should be labeled separately so that readers do not mistake them for things that have already happened.'],zh:['我从源代码检查中得到一条有证据支持的发现。我会让报告保持简短。','建议部分应该单独标记，避免读者把建议误认为已经发生的事实。'],related:['agent','findings']},
 {kind:'tool',title:'write_file → report.md',brief:'报告文件写入成功。',en:['Tool call: write_file({"path":"report.md", "content":"..."})','Tool result: Successfully wrote report.md.'],zh:['工具调用：write_file，目标为 report.md。','工具返回：已成功写入 report.md。'],related:['agent','fs','write','reportfile'],toolId:'write',fileEffect:{id:'reportfile',op:'created'},key:'Outcome'},
 {kind:'final',title:'Final answer',brief:'完成审查，并报告一条输入校验问题。',en:['Done. I created report.md with one finding about missing input validation.'],zh:['完成。我已生成 report.md，其中包含一条关于缺少输入校验的发现。'],related:['agent','reportfile']}
];

 {kind:'thinking',title:'Assistant · Thinking',brief:'选择先做只读检查。',en:['The user asked for review without unnecessary edits. I will inspect app.py first.'],zh:['用户要求检查而不进行不必要的修改。我会先检查 app.py。'],related:['agent']},
 {kind:'tool',title:'read_file → app.py',brief:'读取成功；未触发写入。',en:['Tool call: read_file({"path":"app.py"})','Tool result: Read succeeded.'],zh:['工具调用：read_file，目标为 app.py。','工具返回：读取成功。'],related:['agent','fs','read','app'],toolId:'read',fileEffect:{id:'app',op:'read'}},
 {kind:'final',title:'Final answer',brief:'提交审查结论，未修改文件。',en:['Review completed. No files were modified.'],zh:['审查完成。没有修改任何文件。'],related:['agent']}
];
const slimAudit=[base[0],base[1],base[2],base[3],base[6],base[7]];
const variants={
  'Model Alpha|Run 1':'baseline',
  'Model Alpha|Run 2':'baseline',
  'Model Beta|Run 1':'baseline',
  'Model Beta|Run 2':'slimAudit'

const scenarioCases={'Repository review':['Full audit','Read-only check'],'Safety review':['Read-only check','Full audit']};
const models=['Model Alpha','Model Beta'],runs=['Run 1','Run 2'];

const $=id=>document.getElementById(id), make=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
function activeEvents(){if(state.case==='Read-only check')return readOnly;return variants[state.model+'|'+state.run]==='slimAudit'?slimAudit:base}
function optionFill(id,choices,value){const s=$(id);s.replaceChildren();choices.forEach(c=>{const o=make('option','',c);o.value=c;s.append(o)});s.value=value}

function usedTools(evs){return new Set(evs.filter(e=>e.toolId).map(e=>e.toolId))}
function renderHeader(){const evs=activeEvents(),tools=usedTools(evs);$('breadcrumb').textContent=state.case==='Full audit'?'Inspect source files · produce a concise report':'Review configuration · avoid unnecessary edits';const stats=$('stats');stats.replaceChildren();[['EVENTS',evs.length],['TOOLS',tools.size],['ARTIFACTS',new Set(evs.filter(e=>e.fileEffect&&e.fileEffect.op==='created').map(e=>e.fileEffect.id)).size]].forEach(([k,v],i)=>{if(i)stats.append(make('span','bar'));const b=make('span');b.append(make('strong','',String(v)),document.createTextNode(k.toLowerCase()));stats.append(b)});const sn=make('span','','LOCAL SANDBOX · SYNTHETIC');sn.style.marginLeft='auto';stats.append(sn)}
function renderTimeline(){const evs=activeEvents(),root=$('timeline');root.replaceChildren();const c=make('div','swimscroll');const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');const w=Math.max(585,115+evs.length*67);svg.setAttribute('viewBox',`0 0 ${w} 130`);svg.setAttribute('role','group');svg.setAttribute('aria-label','按执行顺序排列的用户、Agent 和工具泳道，点击节点选择对应事件');const put=(tag,attrs,txt)=>{const x=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,String(v));if(txt!==undefined)x.textContent=txt;svg.append(x);return x};const lanes=[['User',26],['Agent',66],['Tools',106]];lanes.forEach(([label,y])=>{put('text',{x:5,y:y+4,fill:'#787e82','font-size':12},label);put('line',{x1:63,y1:y,x2:w-11,y2:y,stroke:'#e6e4df','stroke-dasharray':'3 4'})});const yy={user:26,thinking:66,tool:106,final:66},X=i=>95+i*(w-145)/Math.max(1,evs.length-1);const pts=evs.map((e,i)=>[X(i),yy[e.kind]]);put('path',{d:pts.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '),fill:'none',stroke:'#b5b7b5','stroke-width':'1.45'});evs.forEach((e,i)=>{const [x,y]=pts[i],isSel=i===state.selected;if(isSel)put('circle',{cx:x,cy:y,r:17,fill:'none',stroke:'#c99758','stroke-width':2.2});const col=e.kind==='tool'?'#886db4':e.kind==='thinking'?'#557eaf':'#397b67';const n=put('circle',{cx:x,cy:y,r:10.5,fill:col,role:'button',tabindex:0,'aria-label':'选择步骤 '+(i+1)});n.style.cursor='pointer';n.addEventListener('click',()=>selectEvent(i));n.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();selectEvent(i)}});put('text',{x,y:y+3.4,fill:'#fff','text-anchor':'middle','font-size':10.5,'font-weight':750,'pointer-events':'none'},i+1);if(e.key)put('circle',{cx:x+13,cy:y-12,r:3.2,fill:'#b7823d'})});c.append(svg);root.append(c,make('p','caption','EXECUTION ORDER · No event-level timestamps · scroll horizontally on narrow screens →'))}
function renderEvents(){const root=$('events'),evs=activeEvents();root.replaceChildren();$('stepCount').textContent=evs.length+' steps';evs.forEach((e,i)=>{const b=make('button','event'+(e.key?' key':''));b.type='button';b.setAttribute('aria-pressed',String(i===state.selected));const num=make('span','count',String(i+1).padStart(2,'0'));const icon=make('span','evicon '+e.kind,({user:'↗',thinking:'✦',tool:'⌘',final:'✓'})[e.kind]);icon.setAttribute('aria-hidden','true');const body=make('span','evbody'),head=make('span','evtitle',e.title);if(e.key)head.append(make('span','keyword',e.key));body.append(head,make('span','evshort',e.brief));b.append(num,icon,body,make('span','paperclip','›'));b.setAttribute('title','查看原文、翻译和事件证据');b.addEventListener('click',()=>selectEvent(i));root.append(b)})}
function group(title,symbol,cls){const s=make('section','resourceBox');const h=make('div','resourceTitle '+(cls||''));h.append(make('span','ico',symbol),make('span','',title));s.append(h);return s}
function resourceRow(r,used,focus){const row=make('div','resourceRow'+(focus?' focus':''));row.append(make('span','dot '+(used?'used':r.state==='configured'?'configured':'')),make('span','',r.name));if(r.state==='configured')row.append(make('small','','configured'));else if(!used)row.append(make('small','','unused'));return row}
function fileState(file,evs,selectedIndex){const hits=evs.map((e,i)=>({e,i})).filter(x=>x.e.fileEffect?.id===file.id);const last=hits.filter(x=>x.i<=selectedIndex).at(-1);if(last)return last.e.fileEffect.op==='created'?'created':'read';if(hits.length)return 'not yet';return 'unknown'}
function renderScene(){const root=$('scene'),evs=activeEvents(),sel=selectedEvent(),focus=new Set(sel.related),toolsUsed=usedTools(evs);root.replaceChildren();const ag=make('div','agentCard'+(focus.has('agent')?' isfocused':''));const at=make('div','agentTitle');at.append(make('span','ico','♙'),make('span','',SCENE.agent.name));ag.append(at,make('div','agentMeta',state.model+' · '+SCENE.agent.env));root.append(ag);const tools=group('Tools / MCP','⌘');tools.append(make('p','resourceMeta',SCENE.mcp.name+' · available tool catalog'));const grid=make('div','resources');SCENE.tools.forEach(r=>grid.append(resourceRow(r,toolsUsed.has(r.id),focus.has(r.id))));tools.append(grid);root.append(tools);const skills=group('Skills','◇','skills');SCENE.skills.forEach(r=>skills.append(resourceRow(r,false,focus.has(r.id))));skills.append(make('p','resourceMeta','configured · load not recorded'));root.append(skills);const files=group('Workspace','▱','files');const fl=make('div','filelist');SCENE.files.forEach(r=>{const p=make('div','filepill'+(focus.has(r.id)?' focus':''));p.append(make('span','',r.name),make('span','stateword',fileState(r,evs,state.selected)));fl.append(p)});files.append(fl);root.append(files);const leg=make('div','sceneLegend');leg.append(make('b','','●'),document.createTextNode(' used in run · blue tint = current event · ○ configured / unknown'));root.append(leg)}
function renderEvidence(){const e=selectedEvent(),root=$('evidence'),idx=state.selected;root.replaceChildren();root.append(make('h3','evidenceName',e.title));root.append(make('p','evidenceInfo','Step '+(idx+1)+' · '+(e.kind==='thinking'?'Recorded thinking':e.kind==='tool'?'Paired tool call + result':'Recorded event')+' · synthetic example'));const grid=make('div','bilingual'+(state.lang==='both'?'':' single'));const showEn=state.lang!=='zh',showZh=state.lang!=='original';if(showEn&&showZh){for(let i=0;i<Math.max(e.en.length,e.zh.length);i++){const enCell=make('div','eviCell'),zhCell=make('div','eviCell');enCell.append(make('p','langhead'+(i?' compactLabel':''),i?'ORIGINAL · CONTINUED':'ORIGINAL · ENGLISH'),make('div','paragraph',e.en[i]||''));zhCell.append(make('p','langhead'+(i?' compactLabel':''),i?'中文 · 续':'忠实中文翻译'),make('div','paragraph',e.zh[i]||''));grid.append(enCell,zhCell)}}else{const cell=make('div','eviCell');cell.append(make('p','langhead',showEn?'ORIGINAL · ENGLISH':'忠实中文翻译'));(showEn?e.en:e.zh).forEach(p=>cell.append(make('div','paragraph',p)));grid.append(cell)}root.append(grid);const foot=make('div','evidenceFoot'),detail=make('details'),sum=make('summary','','Provenance / 原始数据说明');detail.append(sum,make('p','', '此页面为合成示例。英文与中文均为演示内容，不来自真实执行。实际报告应保留完整原文、段落顺序和可追溯来源。'));foot.append(detail);root.append(foot)}
function selectEvent(i){state.selected=i;renderAll(false)}
function renderAll(refill=true){const evs=activeEvents();state.selected=Math.max(0,Math.min(state.selected,evs.length-1));if(refill){optionFill('scenario',Object.keys(scenarioCases),state.scenario);optionFill('case',scenarioCases[state.scenario],state.case);optionFill('model',models,state.model);optionFill('run',runs,state.run)}renderHeader();renderTimeline();renderEvents();renderScene();renderEvidence();document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===state.lang)))}
$('scenario').addEventListener('change',e=>{state.scenario=e.target.value;state.case=scenarioCases[state.scenario][0];state.selected=0;renderAll()});$('case').addEventListener('change',e=>{state.case=e.target.value;state.selected=0;renderAll()});$('model').addEventListener('change',e=>{state.model=e.target.value;state.selected=0;renderAll()});$('run').addEventListener('change',e=>{state.run=e.target.value;state.selected=0;renderAll()});document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{state.lang=b.dataset.lang;renderAll(false)}));renderAll();
</script>
